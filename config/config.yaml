  textos:
    # F2 (RN-22): legenda do gráfico quando algum mês exibido não tem par no ano anterior; {mes} = primeiro mês da série
    sem_ly: "sem LY na série (Mtrix a partir de {mes})"
    # F5 (RN-25): comparativo anual sem par e situação de cada ano na tabela "Ano a ano"; {mes} = primeiro mês da série
    sem_par_anual: "sem par na série (Mtrix a partir de {mes})"
    ano_completo: "{n} de 12"
    ano_em_curso: "{n} de 12 · em curso"
    ano_incompleto: "{n} de 12 · incompleto (série começa em {mes})"
    # F6 (RN-27, RN-30, RN-34): textos da aba Penetração; {mes} = mês fechado, {mes_ref} = mês de referência, {p} = percentil,
    # {janela} = janela do fator, {n} = mínimo de lojas
    pen_competencia: "Competência: {mes} (último mês fechado)"
    pen_competencia_parcial: "Competência: {mes}, último mês fechado ({mes_ref} em andamento não entra)"
    pen_referencia: "referência: P{p} dos distribuidores na categoria, {mes}"
    pen_fator_indisponivel: "fator indisponível: nenhuma loja fez a primeira compra da categoria na janela {janela}"
    pen_censura: "a primeira compra da categoria é observada desde {mes}; lojas que já compravam antes disso não contam como novas"
    # F10 (D-A): legenda do potencial nos níveis acima do distribuidor, onde o número é soma; {n} = distribuidores do nível, {medida} = kg | R$
    pen_soma: "soma de {n} distribuidores do nível (cada um: lojas a positivar × {medida}/loja usado × fator)"
    pen_media_canal: "média do canal (< {n} lojas compradoras)"
    pen_acima_referencia: "acima da referência"
    # F7 (RN-32, RN-33): janela e notas dos blocos de ativação e recorrência; {janela} = 1º a último mês, {n} = meses
    pen_janela: "janela {janela}: os {n} meses que terminam no mês fechado"
    pen_ativacao_nota: >-
      Ativação = ampliar quem compra a categoria. Base elegível = base ativa do nível (não existe cadastro de PDVs
      elegíveis nas bases); a ativar = base ativa − PDVs que compraram a categoria em pelo menos um mês da janela.
      Não confundir com "lojas a positivar" (gap do mês contra a referência): são réguas e nomes distintos.
    # F9 (RN-48): textos do bloco de resumos
    resumo_titulo: "Resumo do recorte"
    resumo_sem_dado: "sem dado suficiente para {indicador} no recorte"
    resumo_sem_ly: "sem LY na série"
    resumo_atencao: "atenção"
    resumo_nota: "Frases geradas por regras do config (RN-48), avaliadas sobre o recorte atual; \"atenção\" marca o limiar da regra. Passe o mouse para ver a memória de cálculo."
    pen_recorrencia_nota: >-
      Recorrência mensal = PDVs que compraram a categoria no mês ÷ PDVs que a compraram na janela; "sem compra no mês"
      é a oportunidade de recorrência. Frequência = meses com compra da categoria na janela (1 a 5). Sem regra de
      sazonalidade: a série é curta; a comparação é com o mesmo mês do ano anterior, quando existir.
    # {mes} e {data} sao preenchidos pelo pipeline (mes de referencia e data da ultima carga)
    mes_em_andamento: >-
      {mes} parcial, atualizado em {data}. Os comparativos confrontam um mês incompleto com meses cheios.
    # RN-58 (decisão 7): nota da estimativa e definição da frequência de compra (aba Definições e memória de cálculo)
    frequencia_nota: "estimativa calibrada no total Mtrix"
    frequencia_definicao: >-
      Frequência de compra = atendimentos (NFs) do mês ÷ PDVs positivados do recorte; devolução não conta e só entram
      linhas com kg maior que zero. A Mtrix entrega a frequência por SKU, então as NFs de cada PDV em cada distribuidor são
      ESTIMADAS: ficam entre a maior frequência de SKU do PDV e a soma das frequências, pela união proporcional, com um
      parâmetro por mês ajustado para que a soma de todos os PDVs feche com o total de atendimentos da Mtrix. PDV com um só
      SKU fica com o valor exato. Acima do distribuidor, as NFs do PDV somam as de todos os distribuidores e o PDV conta uma
      vez. O erro abaixo do canal não é mensurável com as bases. Na lista de PDVs aparece só o mínimo sem estimativa
      (maior frequência de SKU do PDV no mês).
    rtm_sup_nota: "{n} clientes com destino sem cadastro não têm supervisor e não aparecem neste recorte"
    rtm_sup_vazio: "sem clientes RTM com destino deste supervisor"
    rtm_nao_mensuravel: >-
      Cliente cujo distribuidor de destino não existe no de-para de distribuidores, está fora do painel
      (sem linha na hierarquia) ou não reportou sell-out à Mtrix na série. Sem sell-out do destino não
      dá para saber se o cliente comprou dele; por isso ele fica fora do denominador da aderência e nunca
      é contado como "não comprou". É um atributo de cadastro, igual em todos os meses.
  tabela:                                   # usados pelo componente de tabela da Fase 3
    amostra_linhas: 25                      # linhas exibidas por padrão antes de "Expandir"
    debounce_ms: 250                        # espera da busca por texto
    expandir_passo: 200                     # "Expandir" mostra este tanto; "Mostrar mais" acrescenta o mesmo tanto
    expandir_maximo: 2000                   # teto de linhas no DOM de uma vez (busca/ordenação/CSV valem sobre todas)
  abas:                                     # Fase 2 (aprovado 09/09/2026): ordem, rótulo e quais filtros da barra agem em cada aba
    # Refino E1 (13/09/2026, D14): abas Alavancas e Matriz de oportunidades removidas
    # 13/09/2026: "periodo" (RN-59) nas abas com série mensal; RTM recebe supervisor (D18 revista, RN-44) e periodo (só na visão histórico)
    # Refino E3 (13/09/2026, D14/D27): Visão geral + Evolução = "Visão Geral"; Clusters e supervisores + Distribuidores = "Supervisores e distribuidores" (id distribuidores, para não quebrar links)
    # 22/09/2026 (Douglas, RN-44 revista): "distribuidor" na Visão Geral — cards e gráfico mês a mês do distribuidor; ranking do mês oculto
    - {id: visao,          rotulo: "Visão Geral",             filtros: [mes, segmento, distribuidor, categoria, supervisor, calendario, periodo]}
    - {id: distribuidores, rotulo: "Supervisores e distribuidores", filtros: [mes, segmento, distribuidor, categoria, supervisor, calendario, periodo]}
    - {id: pdv,            rotulo: "Pontos de venda",         filtros: [mes, distribuidor, supervisor]}
    - {id: penetracao,     rotulo: "Penetração",              filtros: [segmento, categoria, distribuidor, supervisor], oculta: true}   # F6 (RN-50, A.3): mês fechado; calendário não age · Estabilização A3 (14/09/2026): oculta da navegação, mantida no projeto
    - {id: rtm,            rotulo: "RTM",                     filtros: [mes, supervisor], oculta: true}   # Refino E5: RTM mostra o mês final do período · Estabilização A3 (14/09/2026): oculta da navegação, mantida no projeto
    - {id: definicoes,     rotulo: "Definições",              filtros: []}
  mes_ranking:                              # Refino E3 (D7, 13/09/2026): "O que aconteceu no mês" — maiores quedas e altas vs mês anterior
    n: 5                                    # itens em cada lista (quedas e altas)
  aba_padrao: visao                         # aba aberta quando não há estado salvo (localStorage/URL)
  # ---- F0 (10/09/2026): inertes até a fase indicada. painel.abas só muda na fase que cria a aba (validação exige aba no template);
  # as abas Evolução (F3), Penetração (F6) e Matriz (F8) entram em painel.abas na fase que as cria (RN-50).
  graficos:                                 # RN-46, RN-47 (A.11) — F2: evolucao_ly e chave_padrao; F3: categorias_top_n e categorias_outras_rotulo
    evolucao_ly: coluna_mais_linha          # coluna = mês; linha com marcador = mesmo mês LY (RN-22: sem LY = ausência)
    chave_padrao: pdv                       # F2 (Q-a): pdv | medida — chave do gráfico ao abrir sem estado salvo
    categorias_top_n: 5
    categorias_outras_rotulo: "Outras categorias"
  filtros:
    supervisor:                             # RN-44 (A.13/D18, D19) — fase F4
      selecao: unica
      abas: [visao, distribuidores, pdv, penetracao, rtm]   # rtm: D18 revista (13/09/2026), supervisor do destino
  resumos:                                  # RN-48 (A.14/D17) — F9 (11/09/2026): 24 regras, limiares aprovados item a item pelo Douglas;
                                            # F10 (Q6, Q7): piso de base na D1 (≥ 30 PDVs no mês de comparação) e na R4 (≥ 20 clientes)
    ativo: false                            # Refino E1 (13/09/2026, D18): desligado; código e regras mantidos (regras M* e A* removidas com Matriz e Alavancas)
    # palavras que nenhuma frase pode conter (RN-48: so fatos; sem adjetivo, causa, prescricao, meta ou previsao)
    termos_vetados: [meta, previsão, previsto, garantido, culpa, culpado, deveria, precisa, ruim, ótimo, péssimo, excelente, bom, mau, urgente]
    # cada regra: id · aba · rn · indicador · tipo (operacao do motor) · parametros · texto ({campo}: formato pelo sufixo
    # _pct _pp _t _rs _m _n _dn _dm) · limiar (marca "atencao"; ausente = informativa) · link (proximo nivel)
    regras:
      - {id: V1, aba: visao, rn: RN-21, indicador: "DN do mês", tipo: dn_mes,
         texto: "DN {dn_pct} em {mes}: {d1_pp} vs {mes_ant}; vs {mes_ly}: {dly_pp}",
         limiar: {campo: d1_abs, op: ">=", valor: 1.0, rotulo: "|Δ vs mês anterior| ≥ 1,0 p.p."}, link: {aba: evolucao}}
      - {id: V2, aba: visao, rn: RN-21, indicador: "contribuição dos distribuidores à variação de PDVs", tipo: delta_serie_extremo, fonte: distribuidores, campo: pos, incluir_kpi: true,
         texto: "Cobertura {cob_n} PDVs ({cob_var_pct} vs {mes_ant}): maior queda {min_nome} ({min_d_dn}), maior alta {max_nome} ({max_d_dn})",
         limiar: {campo: ext_abs, op: ">=", valor: 100, rotulo: "|Δ do distribuidor| ≥ 100 PDVs"}, link: {aba: distribuidores, aplicar: "dist:min_nome"}}
      - {id: V3, aba: visao, rn: RN-29, indicador: "categoria com maior queda de % cobertura", tipo: extremo, fonte: categorias, campo: pct_cobertura_var_mes_anterior, direcao: min, saida: valor_pp,
         texto: "Categoria com maior queda de % cobertura: {nome}, {valor_pp} vs {mes_ant}",
         limiar: {campo: valor_pp, op: "<=", valor: -1.0, rotulo: "queda ≥ 1,0 p.p."}, link: {aba: evolucao, aplicar: "cat:id"}}
      - {id: V4, aba: visao, rn: RN-02, indicador: "PDVs sem compra no mês", tipo: pdv_sem_compra,
         texto: "{n_sem_n} pares da base ativa sem compra em {mes} ({pct_pct}), que compraram {kg_t} / {rs_rs} na janela",
         limiar: {campo: pct_pct, op: ">=", valor: 30, rotulo: "≥ 30% da base ativa"}, link: {aba: pdv}}
      - {id: E1, aba: evolucao, rn: RN-46, indicador: "contribuição das categorias à variação do volume", tipo: delta_serie_extremo, fonte: categorias, campo: m, incluir_total: true,
         texto: "Medida {tot_d_dm} vs {mes_ant}: maior retração {min_nome} ({min_d_dm}), maior contribuição {max_nome} ({max_d_dm})",
         limiar: {campo: ext_abs, op: ">=", valor_t: 10, valor_rs: 300000, rotulo: "|Δ da categoria| ≥ 10 t (R$ 300 mil)"}, link: {aba: evolucao, aplicar: "cat:min_id"}}
      - {id: C1, aba: clusters, rn: RN-04, indicador: "variação de DN por cluster", tipo: extremo, fonte: clusters, campo: pct_cobertura_var_mes_anterior, ambos: true, saida: valor_pp,
         texto: "Cluster com maior queda de DN: {min_nome} ({min_valor_pp}); maior alta {max_nome} ({max_valor_pp}) vs {mes_ant}",
         limiar: {campo: ext_abs, op: ">=", valor: 2.0, rotulo: "|Δ| ≥ 2,0 p.p."}, link: {aba: clusters}}
      - {id: C2, aba: clusters, rn: RN-10, indicador: "variação de PDVs por supervisor", tipo: delta_serie_extremo, fonte: supervisores, campo: pos,
         texto: "Supervisor com maior queda de PDVs: {min_nome} ({min_d_dn}); maior alta {max_nome} ({max_d_dn}) vs {mes_ant}",
         limiar: {campo: ext_abs, op: ">=", valor: 100, rotulo: "|Δ| ≥ 100 PDVs"}, link: {aba: clusters, aplicar: "sup:min_id"}}
      - {id: C3, aba: clusters, rn: RN-04, indicador: "menor DN entre supervisores", tipo: extremo, fonte: supervisores, campo: pct_cobertura, direcao: min, saida: valor_pct, comparar: {kpi: pct_cobertura, saida: ref_pct, dif: dif_pp},
         texto: "Menor DN entre supervisores: {nome}, {valor_pct}, {dif_pp} vs o recorte ({ref_pct})",
         limiar: {campo: dif_pp, op: "<=", valor: -5.0, rotulo: "≥ 5,0 p.p. abaixo do recorte"}, link: {aba: clusters, aplicar: "sup:id"}}
      - {id: D1, aba: distribuidores, rn: RN-21, indicador: "variação de cobertura por distribuidor", tipo: extremo, fonte: distribuidores, campo: cobertura_var_mes_anterior, ambos: true, saida: valor_pct, piso: {serie: pos, mes: ant, min: 30, rotulo: "piso: ≥ 30 PDVs no mês de comparação"},
         texto: "Maior queda de cobertura: {min_nome} ({min_valor_pct}); maior alta {max_nome} ({max_valor_pct}) vs {mes_ant}",
         limiar: {campo: ext_abs, op: ">=", valor: 20, rotulo: "|Δ| ≥ 20%"}, link: {aba: distribuidores, aplicar: "dist:min_nome"}}
      - {id: D2, aba: distribuidores, rn: RN-12, indicador: "distribuidores novos", tipo: novos,
         texto: "{n_novos_n} distribuidores novos: {pdvs_n} PDVs ({pct_pct} da cobertura) e {vol_m}", link: {aba: distribuidores, aplicar: "seg:novos"}}
      - {id: D3, aba: distribuidores, rn: RN-30, indicador: "distribuidores abaixo da referência nas foco", tipo: abaixo_p75,
         texto: "{n_um_n} de {n_dist_n} distribuidores abaixo da referência P75 em pelo menos uma categoria foco; {n_quatro_n} nas {n_foco_n}",
         limiar: {campo: pct_quatro_pct, op: ">=", valor: 25, rotulo: "≥ 25% dos distribuidores abaixo nas quatro foco"}, link: {aba: penetracao}}
      - {id: D4, aba: distribuidores, rn: RN-26, indicador: "distribuidores sem venda no mês em andamento", tipo: sem_venda_mes,
         texto: "{n_n} distribuidores ainda sem venda em {mes} (mês em andamento): {lista}",
