         conta_rs: "{a_positivar} × {rs_loja} × {fator_pct} = {potencial_rs}/mês", confere_rs: {op: mul3, a: a_positivar, b: rs_loja, c: fator_pct, r: potencial_rs, k: 0.01},
         conta_soma: "soma de {n_dist} distribuidores do nível = {potencial_t} t/mês", conta_soma_rs: "soma de {n_dist} distribuidores do nível = {potencial_rs}/mês",
         fonte: [sellout, produtos], curated: [DN_PEN_DIST_CAT, DN_PEN_NIVEL_CAT],
         liga: ["pen:potencial_entrada", "col:pen_categorias.potencial_t", "col:pen_categorias.potencial_rs", "col:pen_distribuidores.potencial_t", "col:pen_distribuidores.potencial_rs"],
         nota: "Oportunidade calculada, não previsão. Nunca somar ao potencial em regime: são leituras alternativas do mesmo gap"}
      - {id: potencial_regime, rn: [RN-35], titulo: "Potencial em regime e nomenclatura", indicador: "Potencial em regime", abas: [penetracao], periodo: mes_fechado,
         formula: "no distribuidor: lojas a positivar × medida por loja usada (sem o fator); nos níveis acima: soma dos distribuidores",
         parcelas: [a_positivar, kg_loja, rs_loja, regime_t, regime_rs, n_dist],
         conta: "{a_positivar} × {kg_loja} kg = {regime_t} t/mês", confere: {op: mul, a: a_positivar, b: kg_loja, r: regime_t, k: 0.001},
         conta_rs: "{a_positivar} × {rs_loja} = {regime_rs}/mês", confere_rs: {op: mul, a: a_positivar, b: rs_loja, r: regime_rs, k: 1},
         conta_soma: "soma de {n_dist} distribuidores do nível = {regime_t} t/mês", conta_soma_rs: "soma de {n_dist} distribuidores do nível = {regime_rs}/mês",
         fonte: [sellout, produtos], curated: [DN_PEN_DIST_CAT, DN_PEN_NIVEL_CAT],
         liga: ["pen:potencial_regime", "col:pen_categorias.regime_t", "col:pen_categorias.regime_rs", "col:pen_distribuidores.regime_t", "col:pen_distribuidores.regime_rs"],
         nota: "Teto teórico: supõe a loja nova comprando como as já compradoras desde o 1º mês. Nunca somado ao potencial de entrada"}
      - {id: a_ativar, rn: [RN-32], titulo: "Comprador da categoria e a ativar (objetivo 1)", indicador: "A ativar (janela)", abas: [penetracao], periodo: janela,
         formula: "base elegível − compradores da categoria na janela",
         parcelas: [base_elegivel, compradores_janela, a_ativar], conta: "{base_elegivel} − {compradores_janela} = {a_ativar}",
         confere: {op: sub, a: base_elegivel, b: compradores_janela, r: a_ativar},
         fonte: [sellout, produtos], curated: [DN_PEN_NIVEL_CAT, DN_PDV_CAT_MASCARA],
         liga: ["col:pen_ativacao.a_ativar", "col:pen_distribuidores.a_ativar"],
         nota: "Base elegível = base ativa do nível (RN-41). Comprador na janela = kg maior que zero na categoria em pelo menos um dos 6 meses. Distinto de lojas a positivar, que é a régua do mês contra a referência"}
      - {id: recorrencia, rn: [RN-33], titulo: "Recorrência da categoria (objetivo 2)", indicador: "Recorrência mensal e sem compra no mês", abas: [penetracao], periodo: mes_fechado,
         formula: "compradores da categoria no mês ÷ compradores da categoria na janela × 100; sem compra no mês = a diferença",
         parcelas: [compradores_mes, compradores_janela, recorrencia, sem_compra_mes],
         conta: "{compradores_mes} ÷ {compradores_janela} × 100 = {recorrencia} · sem compra no mês {compradores_janela} − {compradores_mes} = {sem_compra_mes}",
         confere: [{op: div100, a: compradores_mes, b: compradores_janela, r: recorrencia}, {op: sub, a: compradores_janela, b: compradores_mes, r: sem_compra_mes}],
         fonte: [sellout, produtos], curated: [DN_PEN_NIVEL_CAT, DN_PDV_CAT_MASCARA],
         liga: ["col:pen_recorrencia.recorrencia", "col:pen_recorrencia.sem_compra_mes", "col:pen_distribuidores.recorrencia", "col:pen_distribuidores.sem_compra_mes"],
         nota: "Denominador próprio (quem já compra a categoria), diferente do da ativação. A comparação com o mesmo mês do ano anterior fica vazia enquanto não houver janela LY na série"}
      - {id: rtm, rn: [RN-52, RN-54, RN-55], titulo: "Aderência ao direcionamento", indicador: "Aderência, vazamento e ativados parados", abas: [rtm], periodo: mes,
         formula: "compraram do destino ÷ clientes mensuráveis × 100; vazamento = compraram de outro; ativados parados = já compraram do destino e não no mês",
         parcelas: [certo, rastreaveis, pct_aderencia, so_outro, sem_compra, ativados, ativados_parados],
         conta: "{certo} ÷ {rastreaveis} × 100 = {pct_aderencia} · de outro {so_outro} · não compraram {sem_compra} · ativados parados {ativados_parados} de {ativados}",
         confere: {op: div100, a: certo, b: rastreaveis, r: pct_aderencia},
         fonte: [rtm, sellout, distribuidores], curated: [DN_RTM_MES, DN_RTM_CLIENTE_MES], liga: ["rtm:aderencia"],
         nota: "Aderiu quem comprou do destino em qualquer filial. Os clientes com destino não mensurável ficam FORA do denominador e nunca são contados como não comprou (RN-53): hoje são 173, todos por destino sem cadastro. Na visão a partir da migração, os ativados contam desde o corte (RN-54)"}
  definicoes:                               # Refino E6 (13/09/2026): aba Definições em tabelas por tema (indicador · fórmula · observação)
    # marcadores: {janela} meses da base ativa, {novos} meses do segmento Novos, {sem_venda} meses sem venda do segmento Sem venda, {p} percentil da referência, {janela_arq} meses no arquivo
    - tema: "Base e cobertura"
      itens:
        - ["PDV positivado", "PDV com sell-out em kg maior que zero no mês", ""]
        - ["Base ativa", "PDVs positivados em pelo menos um dos últimos {janela} meses", "denominador do DN"]
        - ["Cobertura", "PDVs positivados no mês", "PDVs compradores"]
        - ["% de cobertura (DN)", "cobertura ÷ base ativa × 100", ""]
        - ["Sem compra no mês", "base ativa − cobertura", ""]
    - tema: "Volume e valor"
      itens:
        - ["Volume", "soma do sell-out em kg ÷ 1.000", "toneladas"]
        - ["Valor", "soma do sell-through em R$ reportado à Mtrix", "não é faturamento Dori"]
        - ["kg / PDV e R$ / PDV", "volume ou valor ÷ cobertura", ""]
        - ["Participação", "medida da categoria ÷ medida do canal × 100", ""]
    - tema: "Frequência"
      itens:
        - ["Frequência de compra", "NFs do mês ÷ PDVs compradores", "estimativa: a Mtrix entrega a frequência por SKU; as NFs por PDV são estimadas e calibradas no total da Mtrix"]
    - tema: "Período e comparativos"
      itens:
        - ["vs mês anterior", "(valor ÷ valor do mês anterior − 1) × 100; percentuais em p.p.", "sem par: —"]
        - ["vs L3M", "comparação com a média dos 3 meses anteriores", ""]
        - ["vs LY", "comparação com o mesmo mês do ano anterior", "sem par: —"]
        - ["Acumulado do ano", "soma do início do ano até o mês escolhido", "ano fiscal: set a ago · Ano Calendário: jan a dez"]
        - ["Ano", "acumulado no último mês do ano; o ano em curso vai até o último mês da série", ""]
        - ["PDVs distintos no período", "lojas diferentes com compra no período", "não é soma de meses"]
        - ["O que aconteceu no mês", "diferença absoluta vs o mês anterior: maiores quedas e altas", ""]
        - ["O que aconteceu no período", "diferença absoluta vs o mesmo período do ano anterior", ""]
    - tema: "Penetração"
      itens:
        - ["Penetração", "PDVs que compraram a categoria ÷ PDVs positivados do nível × 100", "último mês fechado"]
        - ["Referência", "percentil {p} da penetração dos distribuidores na categoria", "fixa por categoria"]
        - ["Lojas a positivar", "soma, nos distribuidores abaixo da referência, de (referência − penetração) × positivados ÷ 100", "positivações de categoria, não PDVs"]
        - ["Potencial de entrada", "lojas a positivar × kg por loja compradora × fator observado", "oportunidade calculada, não previsão"]
        - ["Potencial em regime", "lojas a positivar × kg por loja compradora", "teto teórico"]
        - ["A ativar", "base ativa − compradores da categoria nos últimos {janela} meses", ""]
        - ["Recorrência", "compradores da categoria no mês ÷ compradores nos últimos {janela} meses × 100", ""]
    - tema: "RTM"
      itens:
        - ["Aderência", "clientes que compraram do distribuidor destino ÷ clientes mensuráveis × 100", ""]
        - ["Compraram de outro", "clientes mensuráveis que compraram só de outro distribuidor", ""]
        - ["Não compraram", "clientes mensuráveis sem compra no mês", ""]
        - ["Destino não mensurável", "destino sem cadastro, fora do painel ou sem sell-out", "fora do denominador"]
        - ["Ativados", "clientes que já compraram do distribuidor destino", ""]
        - ["Ativados parados", "ativados sem compra do destino no mês", ""]
    - tema: "Regras de contagem"
      itens:
        - ["PDV em mais de um distribuidor", "conta em cada distribuidor e uma vez no canal, no segmento e no supervisor", ""]
        - ["Supervisor", "N3 da hierarquia de hoje, aplicado a toda a série", ""]
        - ["Segmento", "Base atual: mais de {novos} meses de histórico e venda nos últimos {sem_venda} meses · Novos: até {novos} meses · Sem venda: nenhum kg vendido nos últimos {sem_venda} meses (o histórico deles continua no canal)", ""]
        - ["Mês parcial", "mês em andamento, com os dados da última leitura das bases", "comparativos contra meses cheios"]
        - ["Histórico", "últimos {janela_arq} meses da Mtrix", ""]
        - ["Carteira de PDVs ponderados", "linhas da planilha ponderada válidas pela regra de CNPJ", "Destaque e Prime"]
  # 16/09/2026 (Douglas): o filtro "Situação" da tabela de Pontos de venda fica só com Todos da base ativa · Sem compra no mês ·
  # Positivados no mês · Clientes RTM. As opções por categoria (a ativar, na janela sem compra, no mês, positivados sem a categoria;
  # 4 x 10 categorias) confundiam; true volta a mostrá-las. O drill da aba Penetração (oculta) continua funcionando.
  pdv_situacoes_por_categoria: false
  pdv_carteira:                             # RN-56 (11/09/2026, P5–P7): botões da carteira na tabela de Pontos de venda
    ativo: true
    padrao: todos                           # Q1: a aba abria em Destaque; 16/09/2026 (Douglas, Etapa 2): abre em Todos os PDVs "por enquanto"
    rotulo: "Carteira"
    opcoes: [[destaque, "Destaque"], [prime, "Prime"], [todos, "Todos os PDVs"]]
    textos:
      nota: "Carteira {cluster}: {validos} PDVs válidos de {total} na planilha · {fora} fora da regra (linha e motivo em data/dn/quality/carteira_pdv.md)"
      nota_todos: "Carteira ponderada: {validos} PDVs válidos de {total} linhas da planilha ({detalhe}); os botões filtram a lista"
      fora_base: "Da carteira {cluster}, sem compra nos últimos 6 meses e por isso fora desta lista: {lista}"
      definicoes: "A aba Pontos de venda abre na carteira Destaque; os botões Destaque, Prime e Todos os PDVs filtram a lista (RN-56). A carteira vem de DE-PARA_Ponderada_Clusters.xlsx: uma linha entra quando o distribuidor está no painel, o PDV existe na Mtrix e esse distribuidor já vendeu para ele em algum mês da série; as linhas fora da regra ficam listadas em data/dn/quality/carteira_pdv.md, e razão social diferente da Mtrix é só aviso. Os atalhos de outras abas para esta lista abrem em Todos os PDVs."
  pdv_categoria:                            # RN-38 (A.14/D32) — fase F6
    embutir_mascara: sim                    # medir | sim | nao — F7 (RN-38): medida na F6 em 0,19 MB (20 bits: 0,29 MB), embutida desde a F7
    limite_mb: 1

distribuicao:                               # Etapa 2 (aprovada 16/09/2026): um painel por usuário, no modelo dos Gerenciais (`Dashboard - Gerencial`)
  ativo: true
  destino: "../../../Painéis Comerciais/Gerencial"   # relativo à raiz do projeto (DN/); a pasta de cada usuário é o rótulo da hierarquia
  niveis: {N1: HEAD, N2: GERENTE, N3: SUPERVISOR}  # coluna de DIM_DISTRIBUIDOR de cada nível; os usuários são descobertos dos distribuidores do painel
  prefixo: "Scorecard_DN_"                  # arquivo = prefixo + nível + _ + slug do rótulo + .html (nome estável, como nos Gerenciais)
  ignorar_rotulos: []                       # rótulos que não geram painel (ex.: postos vagos). Q3: gerar para todos
  criar_pasta: true                         # pasta do usuário inexistente: criar (false = registrar erro e seguir)
  em_erro: continuar                        # continuar = gera e publica os que passaram, registra o erro dos outros e sai com exit 1
                                            # abortar_publicacao = gera todos, mas não publica nenhum se algum falhou
                                            # parar = interrompe no primeiro erro (nada publicado)
  rotulo_canal: "{rotulo}"                  # nome do "canal" no painel do usuário ({rotulo}, {nome}, {codigo}); o Head recebe o painel do canal
  gravar_json: false                        # também gravar o painel_dn.json de cada usuário na pasta local (35 MB cada)
  # Q1: benchmark P75, cortes, kg/R$ por loja do canal e fator observado da Penetração vêm do canal inteiro (c["pen_canal"])
  # Q2: no RTM do usuário só os clientes cujo destino (pela chave) é um distribuidor dele; os sem cadastro ficam no canal
  # Q4: `Painéis Comerciais/DN/Scorecard_DN.html` continua sendo o painel do canal; o N1 recebe uma cópia idêntica na pasta dele
  # Q5: carteira de PDVs ponderados só com pares dos distribuidores do usuário; relatório de qualidade só na execução do canal

identidade:                                 # 07/10/2026: layout Dori | Ferrara oficial (era a prévia de 06/10). dn/identidade.py + template/dori/
  ativo: true                               # false = volta ao visual azul anterior (mesmo HTML de antes, sem marca)
  selo: "Scorecard DN · uso interno"        # texto do selo à direita do rodapé (vazio = sem selo)

publicacao:                                 # Fase 5 (padrão de `Painéis Comerciais`: só HTML, nome estável, sem mês)
  pasta: "../../../Painéis Comerciais/DN"      # Etapa 2 (16/09/2026): relativo à raiz do projeto (DN/), sem depender da máquina; era absoluto
  arquivo: "Scorecard_DN.html"
  publicar_mes_em_andamento: true            # Refino E4a (D2, 13/09/2026): o parcial é publicado junto com o último mês fechado (antes: false)
  pular_se_identico: true                    # P6 (15/09/2026): se o publicado já tem o mesmo md5 do gerado, nada é copiado (o OneDrive não ressincroniza)
