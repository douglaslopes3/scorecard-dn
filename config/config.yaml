  memoria:                                  # RN-49 (A.14; §21 do pedido) — F10 (11/09/2026): 26 fichas, aprovadas item a item pelo Douglas (lista ok e D-A opção 1)
    ativo: false                            # Refino E1 (13/09/2026, D18): desligada; código e fichas mantidos (fichas de Matriz e Alavancas removidas)
    marca: "ⓘ"                              # Q1: marca do botão ao lado do número
    copiar: true                              # Q3: botão "copiar" no modal
    tabelas:                                  # Q4: memória por COLUNA (cabeçalho) em todas as ligadas; por LINHA só nas colunas de oportunidade
      por_coluna: true
      por_linha: [a_positivar, potencial_t, potencial_rs, regime_t, regime_rs, a_ativar, sem_compra_mes]
