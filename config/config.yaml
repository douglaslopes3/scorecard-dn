      - {id: P1, aba: pdv, rn: RN-02, indicador: "maior PDV sem compra no mês", tipo: pdv_maior_sem_compra,
         texto: "Maior PDV sem compra em {mes}: {nome} · {dist} · {cnpj}, {kg_t} / {rs_rs} na janela", link: {aba: pdv, aplicar: "dist:dist"}}
      - {id: P2, aba: pdv, rn: RN-02, indicador: "concentração do volume nos maiores PDVs", tipo: pdv_concentracao, n: 1000,
         texto: "Os 10% maiores pares ({n10_n}) concentram {pct10_pct} do volume de {mes}; os {N_n} maiores, {pctN_pct}",
         limiar: {campo: pct10_pct, op: ">=", valor: 70, rotulo: "≥ 70% nos 10% maiores"}, link: {aba: pdv}}
      - {id: R1, aba: rtm, rn: RN-52, indicador: "aderência ao direcionamento", tipo: rtm_aderencia,
