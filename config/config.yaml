    textos:
      titulo: "Memória de cálculo"
      copiar: "Copiar"
      copiado: "copiado para a área de transferência"
      fechar: "Fechar ✕"
      coluna: "Ficha da coluna: abra pelo {marca} de um número ou de uma linha para ver a conta com os valores do recorte"
      conta_ok: "a conta fecha com os números da tela"
      conta_dif: "a conta não fecha com os números da tela: {det}"
