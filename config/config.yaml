      - {id: R4, aba: rtm, rn: RN-52, indicador: "destino com maior gap", tipo: extremo, fonte: rtm_destinos, campo: pct_sem_compra, direcao: max, saida: valor_pct, extras: {sem_compra_n: sem_compra, clientes_n: clientes}, piso: {campo: clientes, min: 20, rotulo: "piso: ≥ 20 clientes no destino"},
         texto: "Destino com maior gap: {nome}, {sem_compra_n} de {clientes_n} clientes sem compra ({valor_pct})",
         limiar: {campo: valor_pct, op: ">=", valor: 50, rotulo: "≥ 50% sem compra"}, link: {aba: rtm}}
      - {id: N1, aba: penetracao, rn: RN-31, indicador: "categoria com mais lojas a positivar", tipo: extremo, fonte: pen_canal, campo: a_positivar, direcao: max, saida: valor_n, nome: categoria, extras: {potencial_m: {t: potencial_t, rs: potencial_rs}},
         texto: "Categoria com mais lojas a positivar: {nome}, {valor_n} (potencial de entrada {potencial_m}/mês)", link: {aba: penetracao, aplicar: "cat:cat_id"}}
      - {id: N2, aba: penetracao, rn: RN-36, indicador: "nível mais distante da referência nas foco", tipo: extremo, fonte: pen_sup_foco, campo: pct_bench, direcao: min, saida: valor_pct, nome: pen_sup,
         texto: "Nível mais distante da referência nas foco: {nome}, {valor_pct} da referência",
         limiar: {campo: valor_pct, op: "<", valor: 70, rotulo: "< 70% da referência"}, link: {aba: penetracao, aplicar: "sup:sup_id"}}
      - {id: N3, aba: penetracao, rn: RN-33, indicador: "maior oportunidade de recorrência", tipo: extremo, fonte: pen_canal, campo: sem_compra_mes, direcao: max, saida: valor_n, nome: categoria, extras: {pct_pct: pct_sem_compra_mes},
