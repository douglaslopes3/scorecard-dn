# Configuração do Scorecard DN (pipeline único `run_dn.py`).
# Toda regra de negócio declarada aqui vem de decisão registrada em docs/ (mapeamento.md §5,
# rodada_2026-09-09.md e a reforma de 09/09/2026 — docs/reforma_fase1.md).
# Caminhos relativos são resolvidos a partir da raiz do projeto (a pasta DN/); absolutos passam direto.

projeto:
  nome: Scorecard DN · Distribuição Numérica
  pasta_dados: data/dn          # staging/, curated/, quality/ ficam aqui
  pasta_logs: data/dn/logs
  # Etapa 1 · performance (P6, 15/09/2026): o JSON (35 MB) e o HTML datado (15 MB) de cada execução são gerados numa pasta
  # LOCAL, fora do OneDrive; só o HTML publicado vai para a pasta sincronizada (publicacao.pasta). Aceita variáveis de
  # ambiente (%LOCALAPPDATA%). null = data/dn/painel (comportamento anterior, dentro do OneDrive).
  pasta_painel: "%LOCALAPPDATA%/Dori/DN/painel"

logs:
  manter_ultimos: 30            # logs e resumos de execução mantidos

recursos:                       # Etapa 1 · performance (P6): convivência com a máquina; não muda nenhum número
  prioridade: abaixo_do_normal  # normal | abaixo_do_normal | baixa — prioridade do processo no Windows (Excel, navegador e
                                # OneDrive recebem CPU primeiro enquanto o pipeline roda)
  threads: 4                    # threads do pyarrow (leitura/gravação de Parquet) e das bibliotecas numéricas; 0 = padrão
                                # da biblioteca (todos os núcleos; a máquina tem 12)

calendario:
  fiscal_mes_inicio: 9          # ano fiscal Dori: setembro a agosto (rodada 2)
  fiscal_prefixo: "FY"
  meses_abrev: [jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]   # rótulos "mmm/aa" do painel (D6)
  # F0 (10/09/2026, evolução): inertes até a fase F5 — RN-23, RN-24 (docs/regras_negocio.md)
  perspectiva_padrao: fiscal                        # RN-24 (A.10/D29): fiscal | civil
  rotulo_fiscal_longo: "Ano fiscal {ano} ({inicio}–{fim})"   # RN-23 (A.10/D4): ex. "Ano fiscal 2026 (set/25–ago/26)"
  rotulo_fiscal_curto: "FY{aa}"                     # RN-23: ex. "FY26"
  # F5 (10/09/2026): rotulos do ano civil, no mesmo molde; {inicio}/{fim} = periodo coberto pelo acumulado
  rotulo_civil_longo: "Ano {ano} ({inicio}–{fim})"  # ex. "Ano 2026 (jan/26–ago/26)"
  rotulo_civil_curto: "{ano}"                       # ex. "2026"

fontes:
  sellout:                      # Mtrix · sell-through por distribuidor × PDV × SKU × mês
    pasta: "bases/Sell Out - MTRIX"
    padroes_aceitos: ["ScoreCard_Mtrix_*.xlsx"]
    aba: Sheet1
    # Arquivos que existem na pasta mas NÃO entram, com o motivo (rodada 5, 08/09/2026).
    # 09/09/2026: jul/26 foi reextraído e voltou para a carga; a lista está vazia.
    # 02/10/2026 (Douglas, opção A): out/26 fora até chegar extração maior — 467 linhas, 7 distribuidores; 7 linhas
    # "VENDAS A VISTA" da ARRUDA (PDV 00000000000000001) = 1,5% > pdv_outro_max_pct. Tirar daqui quando o arquivo crescer.
    arquivos_ignorados:
      "ScoreCard_Mtrix_10.2026.xlsx": "extração de 02/10/2026 com 7 distribuidores; fora até chegar extração maior (Douglas, 02/10/2026)"
    colunas_obrigatorias:
      - "CNPJ do AD."
      - "Agente de Distribuição"
      - "CNPJ Reduzido"
      - "Cód. PDV"
      - "Razão Social PDV"
      - "UF PDV"
      - "Cidade PDV"
      - "Segmento do PDV"
      - "SKU"
      - "Ano/Mês"
      - "# Sell-Out (R$)"
      - "# Sell-Out (Und)"
      - "# Sell-Out (Quilos)"
      - "# Total SKUs"
      - "# Frequência de compra"                # RN-58 (13/09/2026): atendimentos (NFs) por linha; o total do arquivo calibra a estimativa
    # 13/09/2026 (Etapa 1 da frequência, R4): "# PDVs Positivados" saiu das extrações de set/25 em diante; só serve ao aviso
    # informativo "PDVs distintos x total da Mtrix", que roda apenas nos arquivos que ainda a trazem.
    colunas_opcionais: ["Endereço PDV", "Bairro PDV", "CEP PDV", "# PDVs Positivados"]

  # 02/10/2026 (Douglas): Produtos e RTM passaram para a pasta compartilhada com o Gerencial (uma cópia só; antes cada
  # projeto tinha a sua). Produtos idêntico byte a byte; RTM = a versão do DN (a do Gerencial não tinha a coluna CNPJ e
  # dava o mesmo resultado nas 4 colunas comuns).
  produtos:                     # cadastro SKU -> categoria (a categoria da DN vem daqui, rodada 2)
    arquivo: "../../bases compartilhadas/Produtos.xlsx"
    aba: Produtos
    colunas_obrigatorias: ["Código Produto", "Descrição Produto", "Categoria"]

  # 02/10/2026 (Douglas): CADASTRO ÚNICO de distribuidores, na pasta compartilhada com o Gerencial (que lê dele o nome
  # do destino do RTM pelo código; a tela do Gerencial segue com a bandeira do BI). "Supervisor" deixou de ser
  # obrigatória: estava vazia nas 81 linhas e o supervisor vem só da Hierarquia.
  distribuidores:               # ponte CNPJ do distribuidor <-> código interno <-> nome reduzido (rodada 3)
    arquivo: "../../bases compartilhadas/Distribuidores_DePara.xlsx"
    aba: Planilha1
    colunas_obrigatorias:
      - "CNPJ DISTRIBUIDOR"
      - "DESCRIÇÃO DISTRIBUIDOR MTRIX"
      - "DESCRIÇÃO BI"
      - "Cód. Interno Cliente"
      - "Status"
      - "Distribuidora Nome Reduzido"
    # C3 (09/09/2026): data de cadastro do distribuidor. OPCIONAL — quando existe, é ela
    # que define a maturidade (Base atual x Novos); sem ela, a maturidade é inferida do
    # 1º mês com sell-out na Mtrix (histórico censurado, o painel escreve "≥").
    # "Supervisor" (opcional desde 02/10/2026) só alimenta a coluna SUPERVISOR_DEPARA do relatório de qualidade.
    colunas_opcionais: ["Data de Cadastro", "Supervisor"]

  # 02/10/2026 (Douglas): a Hierarquia_Consolidada saiu. A hierarquia oficial é a Hierarquia_AAAAMMDD.xlsx da pasta
  # compartilhada com o Gerencial e o ROTA (1 linha por cliente, N1–N4). Vale o arquivo de data MAIS RECENTE no nome;
  # duas datas iguais ou arquivo do padrão sem a data AAAAMMDD válida abortam. Rótulo de cada nível = "código - nome":
  # o nome é limpo quando termina com "(código)" igual ao código da linha (sai o "(código)" e o "_" inicial; regra única
  # dos três painéis, R2 de 02/10/2026); fora disso entra como vem.
  # A Estrutura de Clientes (rede/bandeira) da mesma pasta não é usada no DN (decisão de 02/10/2026); N4 também não.
  hierarquia:
    pasta: "../../bases compartilhadas"     # relativo à raiz do projeto (DN/)
    padrao: "Hierarquia_*.xlsx"
    data_regex: "^Hierarquia_(\\d{8})\\.xlsx$"
    aba: "Hierarquia Vendas"
    coluna_cliente: "Cód. cliente"
    niveis:                                 # nível -> [coluna do código, coluna do nome]
      HEAD: ["Cód. Head Vendas (N1)", "Nome Head Vendas (N1)"]
      GERENTE: ["Cód. Gerente Vendas (N2)", "Nome Gerente Vendas (N2)"]
      SUPERVISOR: ["Cód. Executivo Vendas (N3)", "Nome Executivo Vendas (N3)"]

  rtm:                          # clientes que eram da Dori e passaram ao distribuidor (rodadas 2, 6 e 7)
    arquivo: "../../bases compartilhadas/RTM_DePara_Transicao.xlsx"
    aba: "De-Para RTM"
    colunas_obrigatorias:
      - "CNPJ"
      - "Cód. Cliente [Antigo]"
      - "Dsitribuidor Nome Reduzido"
    # Fase 4 (P2): chave do destino por CNPJ da filial, quando a coluna existir na planilha; sem ela, o
    # destino e casado pelo nome reduzido (e o log lista os nomes que nao casaram).
    colunas_opcionais: ["CNPJ Distribuidor Destino"]

  clusters:                     # OPCIONAL (C5): de-para Segmento do PDV (Mtrix) -> cluster do painel.
    arquivo: "bases/Bases para tabelas dimensões/Clusters_DePara.xlsx"   # ausente: o painel usa os segmentos da Mtrix
    aba: null
    colunas_obrigatorias: ["SEGMENTO MTRIX", "CLUSTER PAINEL"]

  pdv_ponderada:                # OPCIONAL (RN-56, 11/09/2026): carteira de PDVs ponderados (PRIME / DESTAQUE) da aba Pontos de venda
    arquivo: "bases/Bases para tabelas dimensões/DE-PARA_Ponderada_Clusters.xlsx"   # ausente: o painel sai sem a carteira
    aba: "PONDERADA"
    colunas_obrigatorias: ["CNPJ DISTRIBUIDOR", "DISTRIBUIDOR", "CNPJ PDV", "RAZÃO SOCIAL VAREJO", "CLUSTER"]

regras:
  positivado: "PESO_KG > 0"                 # rodada 2
  janela_base_ativa_meses: 6                # rodada 2 · Estabilização A8 (14/09/2026): 5 -> 6, aprovado pelo Douglas
  segmento_novos_meses: 6                   # Base atual acima de 6 meses de histórico; Novos até 6 (rodada 1)
  segmento_sem_venda_meses: 3               # 02/10/2026 (Douglas): sem kg > 0 nos últimos 3 meses até o de referência = Sem venda (vale antes da maturidade)
  distribuidor: "CNPJ de filial"            # rodada 2
  pdv_multi_distribuidor: "conta em cada distribuidor e uma vez no canal"   # rodada 5
  distribuidor_excluir_sem_hierarquia: true # rodada 7: distribuidor sem linha na Hierarquia sai do painel (eram 9; com a Hierarquia_20261001, nenhum)
  # Chave do PDV (rodada 5/6): CNPJ = 14 dígitos; LGPD = id negativo com razão social "LGPD MTX ..." (anonimizado
  # pela Mtrix, estável entre meses); OUTRO = qualquer outra coisa (consumidor final, código interno do distribuidor).
  # Todos entram na fato como PDV. OUTRO acima do limite abaixo rejeita o arquivo (sinal de formato quebrado).
  pdv_chave_lgpd_prefixo: "LGPD"
  # 10/09/2026 (aprovado pelo Douglas): o ultimo mes da serie pode estar EM ANDAMENTO — a Mtrix
  # carregou so uma parte do mes corrente e o Douglas acompanha assim mesmo. auto = e parcial
  # quando o mes de referencia e o mesmo mes da ultima leitura das bases (manifesto); sim/nao
  # forcam. Mes em andamento: nao aborta por distribuidor ainda sem venda, aparece etiquetado no
  # painel e (ver publicacao) nao substitui o ultimo mes fechado ja publicado.
  mes_em_andamento: auto
  rtm:                                      # reforma 09/09/2026 (A4) — usados na Fase 4 do painel
    data_migracao: "2026-09-01"             # migração Dori -> distribuidor; a visão "a partir da migração" começa aqui
    visao_padrao: auto                      # auto = histórico completo enquanto a série não alcança a data_migracao,
                                            #        depois "a partir da migração" | historico_completo | a_partir_da_migracao
  # ---- F0 (10/09/2026, evolução do painel): chaves INERTES até a fase que as implementa.
  # Cada chave cita a regra em docs/regras_negocio.md (RN-nn) e a decisão de origem (Anexo A do
  # docs/evolucao_etapa1_auditoria.md). Nenhuma chave existente mudou de valor nesta fase.
  metrica:                                  # RN-06, RN-09, RN-43 (A.4, A.5) — fase F1
    padrao: t                               # t | rs
    valor_nome: "Valor do sell-through (R$)"
    valor_definicao: "venda do distribuidor ao PDV, em R$, conforme reportado à Mtrix (soma com sinal; não é faturamento Dori)"
    sinais: soma_com_sinal                  # linhas negativas entram com sinal (reconcilia com o total da Mtrix)
    unidades_no_painel: false               # RN-09 (D3): # Sell-Out (Und) fica na fato, fora da tela
    formato_cards_rs: "R$ {valor} mi"       # 1 decimal
    formato_tabela_rs: inteiro_milhar
    formato_rs_pdv_decimais: 2
  penetracao:                               # RN-19, RN-27..RN-31, RN-36, RN-45 — fase F6
    regua_oficial: positivados              # RN-28 (A.2/D23): ÷ positivados do nível; secundária = base_ativa (RN-29)
    periodo: ultimo_mes_fechado             # RN-27 (A.3/D22)
    benchmark:                              # RN-30 (A.1/D14–D16, D21)
      tipo: percentil
      valor: 75
      universo: todos_com_sellout_na_categoria
      minimo_observacoes: 0
      fixo_por_categoria: true              # RN-45: não recalcula com filtro
    categorias_foco: [AMENDOIM, GOMAS, GELATINA, REGALIZ]   # RN-19 (A.8/D33): ids de DIM_PRODUTO.CATEGORIA
    cor_verde_pct: 95                       # RN-36 (A.14/D34): verde quando penetração ≥ 95% do benchmark
    cor_vermelho_pct: 70                    # RN-36: vermelho quando < 70%
    # a janela da base elegível é regras.janela_base_ativa_meses (RN-02, RN-41; D28 = uma janela para tudo; 6 meses desde a A8 de 14/09/2026). Sem chave própria.
  potencial:                                # RN-34, RN-35 (A.7/D25) — fase F6
    fator: observado                        # kg médio das lojas novas na categoria no 1º mês ÷ kg médio dos compradores
    janela_fator_meses: 6                   # A8 (14/09/2026): acompanha a base ativa (D28: uma janela para tudo)
    minimo_lojas_distribuidor: 30           # abaixo disso usa a média do canal, marcado na tabela
    percentil_corte_outliers: 99
    rotulo_entrada: "Potencial de entrada"
    rotulo_regime: "Potencial em regime"
    aviso: "oportunidade calculada, não previsão"
  # Refino E1 (13/09/2026, D14): regras.matriz (RN-42) e regras.alavancas (RN-57) removidas junto com as abas e o código
  carteira:                                 # RN-56 (11/09/2026): validade das linhas da planilha ponderada (Q2–Q5, aprovadas como recomendado)
    clusters_validos: [DESTAQUE, PRIME]
    exige_compra_na_serie: true             # Q3: o distribuidor precisa ter vendido (kg > 0) ao PDV em algum mês da série
    nome_aviso_minimo: 0.5                  # Q4: razão social x nome da Mtrix abaixo disso (palavras em comum ÷ total) = só aviso
    nome_palavras_ignoradas: [LTDA, SA, S, A, ME, EPP, EIRELI, DE, DA, DO, DOS, DAS, E, CIA, L, EI]
  hierarquia:                               # RN-15, RN-16 (A.13/D20) — fase F4
    arquivar_retrato_mensal: true           # curated/historico/DIM_DISTRIBUIDOR_<data>.parquet a cada ingestão
    aviso: "hierarquia vigente em {data}, aplicada a toda a série"
  frequencia:                               # RN-58 (13/09/2026, Etapas 1–2 da frequência, decisões 1, 3, 5, 8)
    # atendimento = 1 NF do distribuidor ao PDV no mês; devolução não conta. A Mtrix entrega a frequência por SKU;
    # a do par distribuidor x PDV é ESTIMADA pela união proporcional, com alfa calibrado todo mês para que a soma
    # dos pares (todas as linhas do arquivo) feche com o total de atendimentos da linha de total da Mtrix.
    regra: uniao_proporcional               # uniao_proporcional (painel) | minimo (maior frequência de SKU do par)
    populacao: kg_positivo                  # R8: só linhas com kg > 0 entram na estimativa exibida (a calibração usa todas, como o total da Mtrix)
    alfa_busca_max: 1000                    # teto da busca do alfa (bisseção); acima disso "nenhum alfa fecha" e a execução aborta
  rtm_destino_chave: codigo                 # 13/09/2026 (decisão 8b): destino = Cód. Cliente [Distribuidor] -> filial no de-para -> nome reduzido do de-para

validacao:
  tolerancia_receita_reais: 1.0
  tolerancia_peso_kg: 0.5
  tolerancia_unidades: 1.0
  cnpj_distribuidor_digitos: 14
  pdv_outro_max_pct: 1.0                    # % das linhas do arquivo com chave OUTRO
  html_max_mb: 20                           # 13/09/2026 (decisão 4): 15, limite confortável; o painel gerado acima disso não é publicado
                                            # 15/09/2026 (pendência 1, aprovação do Douglas): 15 -> 20. Medido em 14,88 MiB com folga de 0,12; os pacotes
                                            # mensais crescem (set/24 86 KiB, ago/26 300 KiB) e a janela móvel de 25 meses não estabiliza o arquivo:
                                            # out/26 estouraria os 15. Sem restrição técnica medida por trás dos 15. Backlog: lista de PDVs em colunas (-1,7 MiB)
  # RN-58: calibração da frequência. Não calibra = aborta (decisão 6): total x PDVs distintos longe de inteiro, frequência do
  # total ausente ou nenhum alfa fecha o total. Alfa fora da faixa = só aviso (medido: 1,088 a 1,134 em 24 meses fechados);
  # mês em andamento não é checado contra a faixa.
  frequencia_tolerancia_inteiro: 0.000001   # |freq_total x PDVs distintos − inteiro| (medido: ≤ 4,4e-11)
  frequencia_tolerancia_total: 0.5          # |Σ estimativa dos pares − atendimentos do total| em NFs após a calibração
  frequencia_alfa_min: 1.05
  frequencia_alfa_max: 1.20

dimensoes:
  rotulo_sem_cadastro: "SEM CADASTRO"
  rotulo_sem_hierarquia: "SEM HIERARQUIA"

painel:
  mes_referencia: null                      # null = último mês da série; ou "AAAA-MM" (também via `run_dn.py --mes`)
  # 10/09/2026 (aprovado pelo Douglas): quantos meses a série APARECE no painel (gráficos, tabelas
  # das séries e evolução do RTM). O cálculo, os cards, a base ativa e o comparativo LY continuam
  # usando todos os meses da Mtrix — só a exibição é cortada. null = mostra a série inteira.
  serie_meses_exibidos: 12
  # Refino E6 (13/09/2026): janela movel do arquivo — so os ultimos N meses da serie vao para o painel (seletor de mes, series dos
  # graficos, pacotes por mes). O calculo continua usando todos os meses (base ativa, LY, acumulados). Mantem o HTML estavel.
  janela_arquivo_meses: 25
  # 13/09/2026 (RN-59, decisão 6 da Etapa 1 e 8 da Etapa 2): seletor "Período" em todas as abas com série mensal. A série INTEIRA
  # vai embutida (compacta) e o navegador só escolhe os pontos: Últimos N meses (padrão = serie_meses_exibidos) · Série completa ·
  # cada ano do calendário ativo (fiscal ou civil). Nada é recalculado no navegador. No RTM age só na visão "histórico completo".
  periodo:
    ativo: true
    rotulo: "Período"
    rotulo_ultimos: "Últimos {n} meses"
    rotulo_tudo: "Série completa"
    nota: ""                                # Refino E1 (D23): sem nota explicativa na barra
  # (Fase 3) a tabela de PDVs é montada pelo componente a partir da lista completa embutida (gzip+base64,
  # decisão A3): amostra, busca e ordenação valem sobre toda a base ativa; não há mais "top N por distribuidor".
  rotulos:                                  # textos que o painel exibe (D5/D6): nada disso fica em código
    canal: "CANAL DISTRIBUIÇÃO"
    categoria_todas: "Todas as categorias"   # rótulo da linha sem recorte de categoria (tabela de distribuidores)
    metrica_t: "Volume · t"                  # F1 (RN-43): chips do seletor de métrica
    metrica_rs: "Valor · R$"
    graf_pdv: "PDVs positivados"             # F2 (RN-47): chip da chave do gráfico (o outro chip usa metrica_t / metrica_rs)
    graf_freq: "Frequência (estimativa)"     # RN-58 (decisões 3 e 7): terceira chave do gráfico · Refino E1 (D17): sinalizada como estimativa
    frequencia: "Frequência de compra (estimativa)"   # RN-58 (decisão 7): card e títulos · Refino E1 (D17)
    frequencia_col: "Freq. compra (est.)"    # RN-58: cabeçalho da coluna nas tabelas · Refino E1 (D17)
    # 22/09/2026 (Douglas): rótulo frequencia_pdv ("NFs mín. no mês") removido — a coluna saiu da tabela de PDVs e nf_min do blob
    evo_todas: "todas"                       # F3 (RN-46): botões da evolução por categoria
    evo_foco: "só as foco"
    evo_total: "Total do canal"
    supervisor_todos: "Todos os supervisores"   # F4 (RN-44): primeira opção do select de supervisor
    cal_fiscal: "Ano fiscal"                 # F5 (RN-24): chips do toggle de calendário
    cal_civil: "Ano Calendário"              # Refino E1 (D9): era "Ano civil"
    acum_ano: "Acumulado no ano"             # F5 (RN-25): linha da Visão geral e bloco da Evolução
    acum_col: "Acum. no ano"                 # F5: cabeçalho da coluna nas tabelas
    pen_todas: "Todas as 10 categorias"      # F6 (RN-19): linha abaixo dos cards das foco
    pen_ativar: "A ativar (janela)"          # F7 (RN-32): bloco e coluna
    pen_sem_compra: "Sem compra no mês"      # F7 (RN-33): oportunidade de recorrência
    pdv_novo: "Novo na janela"               # F7 (A.6): coluna da tabela de PDVs (PRIMEIRO_MES dentro da janela)
    pdv_sit_ativar: "A ativar em {cat}"      # F7 (RN-38): situações por categoria no select da tabela de PDVs
    pdv_sit_sem_mes: "Compram {cat} na janela, sem compra no mês"
    pdv_sit_mes: "Compram {cat} no mês"
    pdv_sit_pos_sem: "Positivados no mês sem {cat}"   # F8: situação no select da tabela de PDVs (comprou do distribuidor no mês, não a categoria)
    lateral_titulo: "Filtros"                 # Refino E2 (D10-D13): barra lateral, Limpar e Voltar
    lateral_recolher: "Recolher filtros"
    lateral_expandir: "Expandir filtros"
    lateral_limpar: "Limpar filtros"
    lateral_voltar: "Voltar"
    lateral_parcial: "parcial"                # etiqueta do mês na linha de filtros ativos quando o mês está em andamento
    lateral_mes: "Mês"                        # Refino E4a (D2): seletor de mês da lateral
    carregando: "carregando os dados do painel…"   # Refino E4a (D22): enquanto as tabelas comprimidas são abertas
    pdv_mes_nota: "Lista de PDVs de {mes}: a lista só existe para o mês parcial e o mês fechado"   # Refino E4b
    per_rotulo: "Período"                     # Refino E5 (D8, D26): seletor de período unificado
    per_mes: "Mês"
    per_acum: "Acumulado do ano"
    per_ano: "Ano"
    per_serie_completa: "Série completa"
    per_card_pdvs: "PDVs distintos no período"
    per_card_vol: "Volume acumulado"
    per_card_rs: "Valor acumulado"
    per_card_freq: "Frequência de compra acumulada (estimativa)"
